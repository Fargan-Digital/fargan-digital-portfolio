<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0A1526"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Cyber Cyan Neon Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <!-- Electric Violet Magenta Accent -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="glowTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Tech Canvas -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#00F5FF" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="0" y1="50" x2="500" y2="50"/>
    <line x1="0" y1="150" x2="500" y2="150"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="350" x2="500" y2="350"/>
    <line x1="0" y1="450" x2="500" y2="450"/>
  </g>

  <!-- Ambient Backlight Circle -->
  <circle cx="250" cy="210" r="140" fill="#00F5FF" opacity="0.08" filter="url(#neonGlow)"/>

  <!-- ==============================================
       ISOMETRIC 3D MONOGRAM "F" (CUBE & PILLARS)
       Representing: 3D Metaverse World + "F" + Digital Portal
       ============================================== -->
  <g transform="translate(0, -15)">
    <!-- Top Face (Roof of F Tower) -->
    <polygon points="250,75 350,132 250,190 150,132" fill="url(#glowTop)" filter="url(#softGlow)" />
    
    <!-- Left Face: Main F Vertical Spine (Darker contrast) -->
    <polygon points="150,132 250,190 250,345 150,287" fill="#08213E" />
    
    <!-- Right Face: Primary Neon Cyan Face -->
    <polygon points="250,190 350,132 350,210 285,248 285,268 335,240 335,285 285,315 285,345 250,365" fill="url(#cyanGrad)" />

    <!-- Isometric F Cutout Bars (The 2 Upper Horizontal Arms of "F") -->
    <!-- Top Horizontal Wing of F -->
    <polygon points="250,190 350,132 350,172 250,230" fill="url(#purpleGrad)" opacity="0.95" />
    <polygon points="250,230 350,172 350,188 250,246" fill="#034B9C" />

    <!-- Middle Horizontal Wing of F -->
    <polygon points="250,250 325,207 325,237 250,280" fill="url(#cyanGrad)" filter="url(#softGlow)" />
    <polygon points="250,280 325,237 325,250 250,293" fill="#022B5E" />

    <!-- Left Pillar Edge Highlight (Pure Crisp Cyber Glow) -->
    <polyline points="150,132 250,190 250,365" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <!-- Outer Isometric Edge Glow -->
    <polygon points="250,75 350,132 350,188 325,202 325,250 285,273 285,345 250,365 150,287 150,132" 
             fill="none" stroke="#00F5FF" stroke-width="2.5" filter="url(#neonGlow)" />

    <!-- Core Energy Nexus Cube at center (Floating Portal Node) -->
    <polygon points="250,190 270,178 270,202 250,214" fill="#FFFFFF" opacity="0.9" filter="url(#softGlow)" />
    <polygon points="250,190 230,178 230,202 250,214" fill="#38BDF8" opacity="0.7" />
    <polygon points="250,166 270,178 250,190 230,178" fill="#E0F2FE" />
  </g>

  <!-- TYPOGRAPHY / WORDMARK -->
  <text x="250" y="415" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="9" 
        fill="#FFFFFF" 
        text-anchor="middle">FARGAN</text>

  <text x="250" y="445" 
        font-family="monospace, sans-serif" 
        font-size="13" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#00F5FF" 
        text-anchor="middle">DIGITAL CREATIVE</text>

  <text x="250" y="468" 
        font-family="monospace, sans-serif" 
        font-size="10" 
        font-weight="500" 
        letter-spacing="3" 
        fill="#64748B" 
        text-anchor="middle">METAVERSE &amp; AI ARCHITECTURE</text>
</svg>
