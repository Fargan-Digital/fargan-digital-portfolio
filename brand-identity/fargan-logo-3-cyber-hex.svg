<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030812"/>
      <stop offset="60%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#01040A"/>
    </linearGradient>

    <!-- Top Left to Bottom Right Electric Gradient -->
    <linearGradient id="cyberWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#00A2FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="hyperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad3)" />

  <!-- Outer Cyber Hexagon Perimeter (Web3 & Metaverse Token Shield) -->
  <polygon points="250,30 395,114 395,282 250,366 105,282 105,114" 
           fill="none" 
           stroke="#00F5FF" 
           stroke-width="1.5" 
           stroke-dasharray="10 14"
           opacity="0.3" />

  <polygon points="250,42 383,119 383,273 250,350 117,273 117,119" 
           fill="#050E1C" 
           fill-opacity="0.5" 
           stroke="#38BDF8" 
           stroke-width="1"
           opacity="0.4" />

  <!-- ==============================================
       THE MINIMALIST DUAL-WING "F"
       Engineered from two sleek aerodynamic supersonic blades
       Blade 1: The Top Wing (Full width with arrow tip)
       Blade 2: The Mid Wing (Compact speed bar)
       Vertical Anchor: The Power Stem
       ============================================== -->
  <g transform="translate(0, -5)">
    <!-- Vertical Power Monolith Spine -->
    <path d="M 175 105 
             L 215 85 
             L 215 310 
             L 175 290 Z" 
          fill="url(#cyberWingGrad)" 
          filter="url(#hyperGlow)" />

    <!-- Top Cyber Wing of F (Extends far right with angled aero cut) -->
    <path d="M 215 85 
             L 345 85 
             L 305 145 
             L 215 145 Z" 
          fill="url(#cyberWingGrad)" 
          filter="url(#hyperGlow)" />

    <!-- Top Wing Dynamic Tip Spark -->
    <polygon points="345,85 365,85 325,145 305,145" fill="#00F5FF" />

    <!-- Middle Cyber Wing of F (Medium width with matching aero angle) -->
    <path d="M 215 175 
             L 305 175 
             L 270 230 
             L 215 230 Z" 
          fill="url(#neonCyan)" 
          filter="url(#hyperGlow)" />

    <!-- Middle Wing Tip Spark -->
    <polygon points="305,175 322,175 287,230 270,230" fill="#FFFFFF" />

    <!-- Isometric Floor Reflection Line -->
    <ellipse cx="250" cy="335" rx="75" ry="10" fill="#00F5FF" opacity="0.2" filter="url(#hyperGlow)" />
  </g>

  <!-- Clean Precision Dot Coordinates -->
  <circle cx="365" cy="80" r="3.5" fill="#FFFFFF" filter="url(#hyperGlow)"/>
  <circle cx="322" cy="170" r="3.5" fill="#FFFFFF" filter="url(#hyperGlow)"/>
  <circle cx="175" cy="285" r="3" fill="#00F5FF"/>

  <!-- WORDMARK / BRANDING -->
  <text x="250" y="415" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="36" 
        font-weight="900" 
        letter-spacing="11" 
        fill="#FFFFFF" 
        text-anchor="middle">FARGAN</text>

  <text x="250" y="445" 
        font-family="monospace, sans-serif" 
        font-size="13" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#00F5FF" 
        text-anchor="middle">DIGITAL CREATIVE</text>

  <text x="250" y="468" 
        font-family="monospace, sans-serif" 
        font-size="10" 
        font-weight="500" 
        letter-spacing="3" 
        fill="#64748B" 
        text-anchor="middle">ALFARGAN.COM</text>
</svg>
